<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khorkuto TV - Live Streaming</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js Library for M3U8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Splash / Loading Screen -->
    <div id="splash">
        <img src="logo.png" alt="Khorkuto TV" class="splash-logo" onerror="this.src='https://via.placeholder.com/120?text=TV'">
        <h2 style="margin-top: 15px; font-size: 20px; font-weight: bold;">Khorkuto TV</h2>
        <div class="loader"></div>
    </div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/55?text=TV'">
            <div>
                <h2>Khorkuto TV</h2>
                <p>Live TV Network</p>
            </div>
        </div>
        <div class="header-right">
            <button id="refreshBtn" title="রিফ্রেশ"><i class="fa-solid fa-rotate-right"></i></button>
            <button id="searchBtn" title="সার্চ"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button id="settingsBtn" title="সেটিংস"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <!-- Search Input Area -->
    <div class="search-area">
        <input type="text" id="search" placeholder="চ্যানেল নাম দিয়ে খুঁজুন...">
    </div>

    <!-- Category Slider -->
    <div class="category-slider">
        <div class="cat active" data-category="All">
            <i class="fa-solid fa-border-all"></i>
            <span>সব চ্যানেল</span>
        </div>
        <div class="cat" data-category="News">
            <i class="fa-solid fa-newspaper"></i>
            <span>সংবাদ</span>
        </div>
        <div class="cat" data-category="Sports">
            <i class="fa-solid fa-trophy"></i>
            <span>খেলাধুলা</span>
        </div>
        <div class="cat" data-category="Entertainment">
            <i class="fa-solid fa-film"></i>
            <span>বিনোদন</span>
        </div>
        <div class="cat" data-category="Music">
            <i class="fa-solid fa-music"></i>
            <span>গান</span>
        </div>
    </div>

    <!-- Banner / Featured Slider -->
