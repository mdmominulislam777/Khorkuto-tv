<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khorkuto TV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<!-- ================= Fullscreen Splash / Loading Page ================= -->
<div class="splash-screen" id="splashScreen">
    <div class="splash-content">
        <div class="app-logo-box">
            <i class="fa-solid fa-tv logo-icon"></i>
        </div>
        <h1 class="app-name">Khorkuto <span>TV</span></h1>
        
        <div class="loader-line"></div>
        <p class="status-text" id="statusText">ডাটা কানেক্ট করা হচ্ছে...</p>
    </div>
</div>

    <div class="app-loader" id="appLoader">
        <div class="spinner"></div>
        <p>ডাটা লোড হচ্ছে, অপেক্ষা করুন...</p>
    </div>

    <header class="app-header">
        <button class="back-btn" id="backBtn" onclick="showCategoriesView()" style="display: none;">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2 class="header-title" id="headerTitle">Categories</h2>
    </header>

    <main class="main-container">
        <div class="category-grid" id="categoryList"></div>

        <div class="channel-grid" id="channelList" style="display: none;"></div>
    </main>

    <div class="player-modal" id="playerModal">
        <div class="player-box">
            <div class="player-header">
                <span id="playingChannelTitle">Channel Name</span>
                <button class="close-btn" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="video-container">
                <video id="videoPlayer" controls autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
