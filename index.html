<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StreamZX - Live TV</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="//libtl.com/sdk.js" data-zone="11580289" data-sdk="show_11580289"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="splash">
    <div class="splash-content">
        <img src="logo.png" alt="StreamZX" class="splash-logo" onerror="this.onerror=null;this.src='https://via.placeholder.com/120?text=ZX';">
        <h2>StreamZX</h2>
        <div class="loader"></div>
    </div>
</div>

<header class="top-header">
    <div class="header-left">
        <span class="brand-title">Stream<span class="zx-text">ZX</span></span>
    </div>

    <div class="header-right">
        <button id="favHeaderBtn" class="icon-btn" title="Favorites">
            <i class="fa-solid fa-star"></i>
        </button>

        <button id="refreshBtn" class="icon-btn" title="Refresh Channels">
            <i class="fa-solid fa-rotate-right"></i>
        </button>

        <button id="searchBtn" class="icon-btn" title="Search Channels">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
</header>

<div id="searchArea" class="search-area">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="search" placeholder="Search channels...">
</div>

<div id="playerContainer" class="player-container hidden">
    <div class="video-player-wrapper">
        <video id="video" playsinline></video>

        <div id="playerOverlay" class="player-overlay">
            <div class="overlay-top">
                <span id="currentChannelName" class="overlay-title">Live TV</span>
                <div class="top-controls">
                    <button id="muteBtn" class="overlay-btn"><i class="fa-solid fa-volume-high"></i></button>
                    <button id="lockBtn" class="overlay-btn"><i class="fa-solid fa-lock"></i></button>
                    <button id="closePlayerBtn" class="overlay-btn close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="overlay-center">
                <button id="aspectRatioBtn" class="overlay-btn-lg" title="Aspect Ratio"><i class="fa-solid fa-expand"></i></button>
                <button id="pipBtn" class="overlay-btn-lg" title="Picture in Picture"><i class="fa-solid fa-clone"></i></button>
                <button id="rewindBtn" class="overlay-btn-lg"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="overlay-btn-lg play-btn"><i class="fa-solid fa-play"></i></button>
                <button id="forwardBtn" class="overlay-btn-lg"><i class="fa-solid fa-forward-step"></i></button>
                <button id="settingsBtn" class="overlay-btn-lg" title="Settings"><i class="fa-solid fa-gear"></i></button>
                <button id="fullscreenBtn" class="overlay-btn-lg" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
            </div>

            <div class="overlay-bottom">
                <span id="currentTime">00:00</span>
                <input type="range" id="seekBar" value="0" min="0" max="100">
                <span id="duration">00:00</span>
            </div>
        </div>

        <div id="lockOverlay" class="lock-overlay hidden">
            <button id="unlockBtn" class="overlay-btn-lg"><i class="fa-solid fa-lock-open"></i></button>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="section-header">
        <h3 id="mainSectionTitle">⚽ Sports Channels</h3>
    </div>

    <div id="channelList" class="channel-grid"></div>
</div>

<div id="categoryPage" class="category-page hidden">
    <h2 class="page-title">Categories</h2>

    <div class="category-grid">
        <div class="category-item" data-category="Sports">
            <img src="https://cdn-icons-png.flaticon.com/512/857/857418.png" alt="Sports" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=Sports';">
            <span>Sports</span>
        </div>

        <div class="category-item" data-category="Entertainment">
            <img src="https://cdn-icons-png.flaticon.com/512/3163/3163478.png" alt="Entertainment" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=Ent';">
            <span>Entertainment</span>
        </div>

        <div class="category-item" data-category="News">
            <img src="https://cdn-icons-png.flaticon.com/512/2965/2965879.png" alt="News" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=News';">
            <span>News</span>
        </div>

        <div class="category-item" data-category="Movies">
            <img src="https://cdn-icons-png.flaticon.com/512/4221/4221419.png" alt="Movies" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=Movies';">
            <span>Movies</span>
        </div>

        <div class="category-item" data-category="Islamic">
            <img src="https://cdn-icons-png.flaticon.com/512/2867/2867308.png" alt="Islamic" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=Islamic';">
            <span>Islamic</span>
        </div>

        <div class="category-item" data-category="Kids">
            <img src="https://cdn-icons-png.flaticon.com/512/3082/3082060.png" alt="Kids" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=Kids';">
            <span>Kids</span>
        </div>

        <div class="category-item" data-category="Music">
            <img src="https://cdn-icons-png.flaticon.com/512/461/461238.png" alt="Music" onerror="this.onerror=null;this.src='https://via.placeholder.com/80?text=Music';">
            <span>Music</span>
        </div>
    </div>
</div>

<div id="settingsPage" class="settings-page hidden">
    <h2 class="page-title">Settings</h2>

    <div class="settings-list">
        <div class="settings-item">
            <i class="fa-solid fa-layer-group"></i>
            <span>Playlists</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item" id="settingsNoticeBtn">
            <i class="fa-solid fa-bullhorn"></i>
            <span>Notice</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item" id="settingsNetworkStreamBtn">
            <i class="fa-solid fa-network-wired"></i>
            <span>Network Stream</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item">
            <i class="fa-solid fa-circle-info"></i>
            <span>About</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item toggle-item">
            <div class="setting-info">
                <i class="fa-solid fa-moon"></i>
                <span>Dark Theme</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="themeToggle" checked>
                <span class="slider round"></span>
            </label>
        </div>

        <div class="settings-item danger-item" id="settingsClearDataBtn">
            <i class="fa-solid fa-trash-can"></i>
            <span>Clear Data</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item danger-item" id="settingsExitBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Exit App</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>
</div>

<nav class="bottom-navigation" id="bottomNavigation">
    <button class="bottom-nav-btn active" id="liveEventNav">
        <i class="fa-solid fa-tower-broadcast"></i>
        <span>Live Event</span>
    </button>

    <button class="bottom-nav-btn" id="categoryNav">
        <i class="fa-solid fa-layer-group"></i>
        <span>Category</span>
    </button>

    <button class="bottom-nav-btn" id="sportsNav">
        <i class="fa-solid fa-futbol"></i>
        <span>Sports</span>
    </button>

    <button class="bottom-nav-btn" id="settingsNav">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
    </button>
</nav>

<div id="playlistModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-list-ul"></i> IPTV Playlists</h3>
            <button id="closePlaylistModal" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="playlist-action-bar">
            <span>Add Custom Playlist</span>
            <button id="openAddPlaylistBtn" class="add-playlist-btn" title="Add M3U Playlist">
                <i class="fa-solid fa-plus"></i> Add
            </button>
        </div>

        <div id="addPlaylistForm" class="add-playlist-form hidden">
            <input type="text" id="playlistNameInput" placeholder="Playlist Name (e.g. My IPTV)">
            <input type="url" id="playlistUrlInput" placeholder="Enter M3U / M3U8 URL (http://...)">
            <div class="or-divider">OR</div>
            <label class="file-upload-label">
                <i class="fa-solid fa-file-arrow-up"></i> Upload M3U File
                <input type="file" id="playlistFileInput" accept=".m3u,.m3u8,.txt">
            </label>
            <button id="savePlaylistBtn" class="save-btn"><i class="fa-solid fa-check"></i> Save & Load</button>
        </div>

        <div id="playlistContainer" class="playlist-list">
            </div>
    </div>
</div>

<div id="noticeModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-bullhorn"></i> Important Notice</h3>
            <button id="closeNoticeModal" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="noticeBody" style="padding: 15px 0;">
            <p>⏳ Loading notice...</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>

</html>
