<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khorkuto TV - Live Streaming</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js Library for M3U8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Splash / Loading Screen -->
    <div id="splash">
        <img src="logo.png" alt="Khorkuto TV" class="splash-logo" onerror="this.src='https://via.placeholder.com/120?text=Khorkuto+TV'">
        <h2>Khorkuto TV</h2>
        <div class="loader"></div>
    </div>

    <!-- Video Player Container / Modal -->
    <div id="playerContainer" class="player-container hidden">
        <div class="player-header">
            <span id="currentChannelName">চ্যানেল নাম</span>
            <button id="closePlayerBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/55?text=TV'">
            <div>
                <h2>Khorkuto TV</h2>
                <p>Live TV Network</p>
            </div>
        </div>
        <div class="header-right">
            <button id="refreshBtn" title="রিফ্রেশ"><i class="fa-solid fa-rotate-right"></i></button>
            <button id="searchBtn" title="সার্চ"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <!-- Search Input Area -->
    <div class="search-area" id="searchArea">
        <input type="text" id="search" placeholder="চ্যানেল নাম দিয়ে খুঁজুন...">
    </div>

    <!-- Category Slider -->
    <div class="category-slider">
        <div class="cat active" data-category="All">
            <i class="fa-solid fa-border-all"></i>
            <span>সব চ্যানেল</span>
        </div>
        <div class="cat" data-category="Sports">
            <i class="fa-solid fa-trophy"></i>
            <span>খেলাধুলা</span>
        </div>
        <div class="cat" data-category="Entertainment">
            <i class="fa-solid fa-film"></i>
            <span>বিনোদন</span>
        </div>
        <div class="cat" data-category="News">
            <i class="fa-solid fa-newspaper"></i>
            <span>সংবাদ</span>
        </div>
        <div class="cat" data-category="Movies">
            <i class="fa-solid fa-clapperboard"></i>
            <span>মুভি</span>
        </div>
        <div class="cat" data-category="Islamic">
            <i class="fa-solid fa-kaaba"></i>
            <span>ইসলামিক</span>
        </div>
        <div class="cat" data-category="Kids">
            <i class="fa-solid fa-child"></i>
            <span>কার্টুন</span>
        </div>
        <div class="cat" data-category="Music">
            <i class="fa-solid fa-music"></i>
            <span>গান</span>
        </div>
    </div>

    <!-- Featured Section -->
    <section id="featuredSection" class="featured-section">
        <h3 class="section-title">🔥 পপুলার চ্যানেল</h3>
        <div id="featuredList" class="featured-slider"></div>
    </section>

    <!-- Main Channel List Grid -->
    <main class="main-content">
        <h3 class="section-title">📺 লাইভ চ্যানেলসমূহ</h3>
        <div id="channelList" class="channel-grid"></div>
    </main>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
