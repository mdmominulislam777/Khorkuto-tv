<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StreamZX - Live TV</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script src="//libtl.com/sdk.js" data-zone="11580289" data-sdk="show_11580289"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==========================================
     SPLASH SCREEN
========================================== -->
<div id="splash">
    <div class="splash-content">
        <img src="logo.png" alt="StreamZX" class="splash-logo" onerror="this.onerror=null;this.src='https://via.placeholder.com/120?text=ZX';">
        <h2>StreamZX</h2>
        <div class="loader"></div>
    </div>
</div>

<!-- ==========================================
     HEADER
========================================== -->
<header class="top-header">
    <div class="header-left">
        <button id="menuBtn" class="menu-btn" title="Open Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <span class="brand-title">Stream<span class="zx-text">ZX</span></span>
    </div>

    <div class="header-right">
        <button id="favHeaderBtn" title="Favorites">
            <i class="fa-solid fa-star"></i>
        </button>
        <button id="refreshBtn" title="Refresh">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button id="searchBtn" title="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
</header>

<!-- ==========================================
     PLAYER
========================================== -->
<div id="playerContainer" class="player-container hidden">
    <div class="player-header">
        <span id="currentChannelName">Channel Name</span>
        <button id="closePlayerBtn">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <video id="video" controls autoplay playsinline></video>
</div>

<!-- ==========================================
     SEARCH
========================================== -->
<div class="search-area" id="searchArea">
    <input type="text" id="search" placeholder="Search channel name..." autocomplete="off">
</div>

<!-- ==========================================
     CATEGORY PAGE
========================================== -->
<div id="categoryPage" class="category-page hidden">
    <h2 class="page-title">Categories</h2>
    <div class="category-grid">
        <div class="category-item" data-category="Sports">
            <img src="categorylogos/sports.png" alt="Sports" class="cat-img">
            <span>Sports</span>
        </div>
        <div class="category-item" data-category="Entertainment">
            <img src="categorylogos/entertainment.png" alt="Entertainment" class="cat-img">
            <span>Entertainment</span>
        </div>
        <div class="category-item" data-category="News">
            <img src="categorylogos/news.png" alt="News" class="cat-img">
            <span>News</span>
        </div>
        <div class="category-item" data-category="Movies">
            <img src="categorylogos/movies.png" alt="Movies" class="cat-img">
            <span>Movies</span>
        </div>
        <div class="category-item" data-category="Islamic">
            <img src="categorylogos/islamic.png" alt="Islamic" class="cat-img">
            <span>Islamic</span>
        </div>
        <div class="category-item" data-category="Kids">
            <img src="categorylogos/kids.png" alt="Kids" class="cat-img">
            <span>Kids</span>
        </div>
        <div class="category-item" data-category="Music">
            <img src="categorylogos/music.png" alt="Music" class="cat-img">
            <span>Music</span>
        </div>
    </div>
</div>

<!-- ==========================================
     SETTINGS PAGE
========================================== -->
<section id="settingsPage" class="settings-page hidden">
    <div class="settings-title-bar">
        <h2>Settings</h2>
    </div>

    <!-- GENERAL SECTION -->
    <div class="settings-group">
        <div class="settings-group-title">GENERAL</div>
        
        <div class="settings-item" id="settingsNetworkStreamBtn">
            <div class="item-left">
                <i class="fa-solid fa-globe"></i>
                <span>Network Stream</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item">
            <div class="item-left">
                <i class="fa-solid fa-bars-staggered"></i>
                <span>Playlists</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item">
            <div class="item-left">
                <i class="fa-solid fa-globe"></i>
                <span>Web Version</span>
                <span class="badge-new">New</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item">
            <div class="item-left">
                <i class="fa-solid fa-cricket-bat-ball"></i>
                <span>Cricket Score</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item">
            <div class="item-left">
                <i class="fa-solid fa-futbol"></i>
                <span>Football Score</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>

    <!-- COMMUNITY SECTION -->
    <div class="settings-group">
        <div class="settings-group-title">COMMUNITY</div>

        <a href="https://t.me/your_channel" target="_blank" class="settings-item">
            <div class="item-left">
                <i class="fa-brands fa-telegram"></i>
                <span>Join Channel</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        
        <div class="settings-item">
            <div class="item-left">
                <i class="fa-solid fa-circle-question"></i>
                <span>Contact Us</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>

    <!-- APP SECTION -->
    <div class="settings-group">
        <div class="settings-group-title">APP</div>

        <div class="settings-item" id="settingsClearDataBtn">
            <div class="item-left">
                <i class="fa-solid fa-trash-can"></i>
                <span>Clear App Data</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="settings-item danger-item" id="settingsExitBtn">
            <div class="item-left">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Exit Application</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>
</section>

<!-- ==========================================
     MAIN CHANNELS
========================================== -->
<main class="main-content">
    <h3 class="section-title" id="mainSectionTitle">⚽ Sports Channels</h3>
    <div id="channelList" class="channel-grid"></div>
</main>

<!-- ==========================================
     BOTTOM NAVIGATION
========================================== -->
<nav class="bottom-navigation" id="bottomNavigation">
    <!-- LIVE EVENT -->
    <button class="bottom-nav-btn active" id="liveEventNav">
        <i class="fa-solid fa-tower-broadcast"></i>
        <span>Live Event</span>
    </button>

    <!-- CATEGORY -->
    <button class="bottom-nav-btn" id="categoryNav">
        <i class="fa-solid fa-layer-group"></i>
        <span>Category</span>
    </button>

    <!-- SPORTS -->
    <button class="bottom-nav-btn" id="sportsNav">
        <i class="fa-solid fa-futbol"></i>
        <span>Sports</span>
    </button>

    <!-- SETTINGS -->
    <button class="bottom-nav-btn" id="settingsNav">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
    </button>
</nav>

<!-- ==========================================
     JAVASCRIPT
========================================== -->
<script src="script.js"></script>

</body>
</html>
