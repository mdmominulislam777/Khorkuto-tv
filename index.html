<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StreamZX - Live TV</title>

    <!-- Google Fonts for Logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js Library for M3U8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="brand-logo logo-splash">
            <div class="logo-icon-wrap">
                <span class="speed-line"></span>
                <span class="speed-line"></span>
                <div class="play-btn">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>
            <div class="brand-title">
                <span class="stream-text">Stream</span><span class="zx-text">ZX</span>
            </div>
        </div>
        <div class="loader"></div>
    </div>

    <!-- Video Player Modal -->
    <div id="playerContainer" class="player-container hidden">
        <div class="player-header">
            <span id="currentChannelName">Channel Name</span>
            <button id="closePlayerBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <div class="brand-logo">
                <div class="logo-icon-wrap">
                    <span class="speed-line"></span>
                    <span class="speed-line"></span>
                    <div class="play-btn">
                        <i class="fa-solid fa-play"></i>
                    </div>
                </div>
                <div class="brand-title">
                    <span class="stream-text">Stream</span><span class="zx-text">ZX</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button id="favHeaderBtn" title="Favorites"><i class="fa-solid fa-heart"></i></button>
            <button id="refreshBtn" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
            <button id="searchBtn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <!-- Search Input Area -->
    <div class="search-area" id="searchArea">
        <input type="text" id="search" placeholder="Search channel name...">
    </div>

    <!-- Category Slider -->
    <div class="category-slider">
        <div class="cat active" data-category="Sports">
            <i class="fa-solid fa-trophy"></i>
            <span>Sports</span>
        </div>
        <div class="cat" data-category="Entertainment">
            <i class="fa-solid fa-film"></i>
            <span>Entertainment</span>
        </div>
        <div class="cat" data-category="News">
            <i class="fa-solid fa-newspaper"></i>
            <span>News</span>
        </div>
        <div class="cat" data-category="Movies">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Movies</span>
        </div>
        <div class="cat" data-category="Islamic">
            <i class="fa-solid fa-kaaba"></i>
            <span>Islamic</span>
        </div>
        <div class="cat" data-category="Kids">
            <i class="fa-solid fa-child"></i>
            <span>Kids</span>
        </div>
        <div class="cat" data-category="Music">
            <i class="fa-solid fa-music"></i>
            <span>Music</span>
        </div>
    </div>

    <!-- Featured Section -->
    <section id="featuredSection" class="featured-section">
        <h3 class="section-title">🔥 Featured Channels</h3>
        <div id="featuredList" class="featured-slider"></div>
    </section>

    <!-- Main Channel List Grid -->
    <main class="main-content">
        <h3 class="section-title" id="mainSectionTitle">⚽ Sports Channels</h3>
        <div id="channelList" class="channel-grid"></div>
    </main>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
