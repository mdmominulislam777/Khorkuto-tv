<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khorkuto TV - Watch Live TV 24/7</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js for Streaming Support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Telegram Mini App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header -->
    <header class="header">
        <div class="logo-area">
            <i class="fa-solid fa-tv logo-icon"></i>
            <h1 class="logo-text">Khorkuto <span>TV</span></h1>
        </div>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="চ্যানেল খুঁজুন..." oninput="handleSearch()">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="refreshBtn" title="রিফ্রেশ করুন" onclick="refreshApp()">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button class="icon-btn" id="settingsBtn" title="সেটিংস" onclick="toggleSettingsModal(true)">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Telegram & Notice Banner -->
    <div class="notice-banner" id="noticeBanner">
        <div class="banner-content">
            <i class="fa-brands fa-telegram"></i>
            <span>আমাদের অফিশিয়াল টেলিগ্রাম চ্যানেলে যুক্ত থাকুন সব আপডেট পেতে!</span>
        </div>
        <a href="https://t.me/" target="_blank" class="banner-btn">Join Now</a>
        <button class="banner-close" onclick="closeBanner()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Category Filter Navigation -->
    <nav class="categories-wrapper">
        <div class="categories" id="categoryContainer">
            <button class="cat-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> সব</button>
            <button class="cat-btn" onclick="filterCategory('news', this)"><i class="fa-solid fa-newspaper"></i> খবর</button>
            <button class="cat-btn" onclick="filterCategory('sports', this)"><i class="fa-solid fa-trophy"></i> খেলাধুলা</button>
            <button class="cat-btn" onclick="filterCategory('entertainment', this)"><i class="fa-solid fa-film"></i> বিনোদন</button>
            <button class="cat-btn" onclick="filterCategory('favorites', this)"><i class="fa-solid fa-heart"></i> ফেভারিট</button>
            <button class="cat-btn" onclick="filterCategory('history', this)"><i class="fa-solid fa-clock-rotate-left"></i> হিস্ট্রি</button>
        </div>
    </nav>

    <!-- Main Content Area (Only Channel Grid) -->
    <main class="main-container">
        <div class="channel-grid" id="channelGrid">
            <!-- JavaScript-এর মাধ্যমে চ্যানেল লোড হবে -->
        </div>
    </main>

    <!-- Full-Screen Dedicated Video Player View (Modal/Overlay) -->
    <div class="player-overlay hidden" id="playerModal">
        <!-- Player Header Toolbar -->
        <div class="player-header">
            <button class="player-back-btn" onclick="closePlayer()" title="ফিরে যান">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            
            <div class="player-info">
                <img id="playerLogo" src="" alt="Logo" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                <div class="player-title-wrap">
                    <h3 id="playerChannelName">চ্যানেলের নাম</h3>
                    <span class="live-tag"><i class="fa-solid fa-circle"></i> LIVE</span>
                </div>
            </div>

            <div class="player-controls-right">
                <button class="player-icon-btn" id="playerFavBtn" onclick="toggleFavoriteCurrent()" title="ফেভারিট">
                    <i class="fa-regular fa-heart"></i>
                </button>
                <button class="player-icon-btn" onclick="toggleFullscreen()" title="ফুল স্ক্রিন">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>

        <!-- Video Player Body -->
        <div class="player-body" id="playerContainer">
            <video id="videoPlayer" controls autoplay playsinline class="media-player"></video>
            <iframe id="iframePlayer" class="media-player hidden" allowfullscreen allow="autoplay"></iframe>
            <div id="playerLoader" class="player-loader hidden">
                <div class="spinner"></div>
                <p>স্ট্রিম লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop hidden" id="settingsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> অ্যাপ সেটিংস</h3>
                <button onclick="toggleSettingsModal(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <span>ক্লিয়ার ওয়াচ হিস্ট্রি</span>
                    <button class="btn-danger" onclick="clearHistory()">মুছে ফেলুন</button>
                </div>
                <div class="setting-item">
                    <span>ক্লিয়ার ফেভারিট তালিকা</span>
                    <button class="btn-danger" onclick="clearFavorites()">মুছে ফেলুন</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
