<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khorkuto TV - IPTV Portal</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js for IPTV Streaming (.m3u8 & .ts) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Area -->
    <header class="header">
        <div class="logo-area">
            <i class="fa-solid fa-tv logo-icon"></i>
            <h1 class="logo-text">Khorkuto <span>TV</span></h1>
        </div>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="১৩৯টি চ্যানেল থেকে খুঁজুন..." oninput="handleSearch()">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="refreshBtn" title="রিফ্রেশ" onclick="refreshApp()">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button class="icon-btn" id="settingsBtn" title="সেটিংস" onclick="toggleSettingsModal(true)">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Telegram Support Banner -->
    <div class="notice-banner" id="noticeBanner">
        <div class="banner-content">
            <i class="fa-brands fa-telegram"></i>
            <span>Khorkuto Media Network - সব চ্যানেল ও স্ট্রিম আপডেট পেতে টেলিগ্রামে যুক্ত থাকুন!</span>
        </div>
        <a href="https://t.me/livetvsports24_bot" target="_blank" class="banner-btn">Support Bot</a>
        <button class="banner-close" onclick="closeBanner()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Dynamic Category Filter Navigation -->
    <nav class="categories-wrapper">
        <div class="categories" id="categoryContainer">
            <!-- JavaScript এর মাধ্যমে স্বয়ংক্রিয়ভাবে ক্যাটাগরি বাটন তৈরি হবে -->
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="main-container">
        <div class="channel-grid" id="channelGrid">
            <!-- Channel Cards Load Here -->
        </div>
    </main>

    <!-- Full-Screen Player Modal Window -->
    <div class="player-overlay hidden" id="playerModal">
        <!-- Top Toolbar -->
        <div class="player-header">
            <button class="player-back-btn" onclick="closePlayer()" title="ফিরে যান">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            
            <div class="player-info">
                <img id="playerLogo" src="" alt="Logo" onerror="handleImageError(this, 'TV')">
                <div class="player-title-wrap">
                    <h3 id="playerChannelName">চ্যানেল প্লেয়ার</h3>
                    <span class="live-tag"><i class="fa-solid fa-circle"></i> LIVE 24/7</span>
                </div>
            </div>

            <div class="player-controls-right">
                <button class="player-icon-btn" id="playerFavBtn" onclick="toggleFavoriteCurrent()" title="ফেভারিট">
                    <i class="fa-regular fa-heart"></i>
                </button>
                <button class="player-icon-btn" onclick="toggleFullscreen()" title="ফুল স্ক্রিন">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>

        <!-- Video Display Frame -->
        <div class="player-body" id="playerContainer">
            <video id="videoPlayer" controls autoplay playsinline class="media-player"></video>
            <div id="playerLoader" class="player-loader hidden">
                <div class="spinner"></div>
                <p>স্ট্রিম লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- App Settings Modal -->
    <div class="modal-backdrop hidden" id="settingsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> অ্যাপ সেটিংস</h3>
                <button onclick="toggleSettingsModal(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="setting-info">
                    <p><strong>ভার্সন:</strong> v7.0 (IPTV Engine)</p>
                    <p><strong>মোট চ্যানেল:</strong> ১৩৯ টি</p>
                </div>
                <hr style="border-color: var(--border-color); margin: 10px 0;">
                <div class="setting-item">
                    <span>ওয়াচ হিস্ট্রি মুছুন</span>
                    <button class="btn-danger" onclick="clearHistory()">ক্লিয়ার</button>
                </div>
                <div class="setting-item">
                    <span>ফেভারিট তালিকা মুছুন</span>
                    <button class="btn-danger" onclick="clearFavorites()">ক্লিয়ার</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
